if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function ttsReady() { return ST.settings.tts && 'speechSynthesis' in window && VOICES.some(v => /^en/i.test(v.lang)); }
function bestVoice() {
  const en = VOICES.filter(v => /^en/i.test(v.lang));
  return en.find(v => /en[-_]GB/i.test(v.lang) && /google|natural|online/i.test(v.name)) ||
    en.find(v => /en[-_]GB/i.test(v.lang)) || en.find(v => /google/i.test(v.name)) || en[0] || null;
}
function speak(text) {
  if (!ttsReady() || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = bestVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
    u.rate = 0.9; speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}

/* ---------- confetti ---------- */
const FX = { parts: [], raf: 0, cv: null, ctx: null };
function fxInit() {
  FX.cv = $('#fx'); FX.ctx = FX.cv.getContext('2d');
  const fit = () => { FX.cv.width = innerWidth; FX.cv.height = innerHeight; };
  fit(); addEventListener('resize', fit);
}
function confetti(n, x, y, opts) {
  if (!FX.ctx) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) n = Math.min(n, 20);
  const cols = ['#ffd23f', '#ff6b6b', '#4cc9f0', '#3ddc97', '#a78bfa', '#fb923c', '#f472b6'];
  x = x == null ? innerWidth / 2 : x; y = y == null ? innerHeight * 0.4 : y;
  const spread = (opts && opts.spread) || 1;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (3 + Math.random() * 9) * spread;
    FX.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, g: 0.25 + Math.random() * 0.15, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(cols), life: 90 + rnd(70) });
  }
  if (!FX.raf) FX.raf = requestAnimationFrame(fxStep);
}
function fxStep() {
  const { ctx, cv, parts } = FX;
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life--;
    if (p.life <= 0 || p.y > cv.height + 30) { parts.splice(i, 1); continue; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  FX.raf = parts.length ? requestAnimationFrame(fxStep) : 0;
  if (!parts.length) ctx.clearRect(0, 0, cv.width, cv.height);
}
function confettiFrom(el, n) {
  if (!el) return confetti(n || 60);
  const r = el.getBoundingClientRect(); confetti(n || 60, r.left + r.width / 2, r.top + r.height / 2);
}

/* ---------- toasts & modal ---------- */
function toast(node, kind) {
  const box = $('#toasts');
  const t = h('div', { class: 'toast ' + (kind || '') }, node);
  box.append(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => t.classList.add('out'), 3400);
  setTimeout(() => t.remove(), 3900);
}
let modalEl = null, modalOnClose = null;
/** `silent` drops the dialog without running its onClose (used when the whole screen is being replaced) */
function closeModal(silent) {
  if (modalEl) { modalEl.remove(); modalEl = null; }
  const f = modalOnClose; modalOnClose = null; if (f && silent !== true) f();
}
/** shows a dialog. `onClose` runs when it is dismissed (by any means). */

  modalOnClose = onClose || null;
  modalEl = h('div', { class: 'modal-back', onclick: e => { if (e.target === modalEl && !modalEl.dataset.lock) closeModal(); } },
    h('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' }, content));

/* ============================================================
   Adjectivia — vocabulary model (WORDS_DATA is generated from src/words.txt by build.py)
   ============================================================ */
const CATS = {
  joy:     { label: 'Happy feelings',     ic: '1F604', macro: 'FEEL',    val: 1 },
  sad:     { label: 'Sad feelings',       ic: '1F622', macro: 'FEEL',    val: -1 },
  angry:   { label: 'Angry feelings',     ic: '1F620', macro: 'FEEL',    val: -1 },
  fear:    { label: 'Scared & worried',   ic: '1F628', macro: 'FEEL',    val: -1 },
  feel:    { label: 'Other feelings',     ic: '1F62E', macro: 'FEEL',    val: 0 },
  body:    { label: 'Body & health',      ic: '1F912', macro: 'BODY',    val: 0 },
  trait:   { label: 'Personality',        ic: '1F9B8', macro: 'TRAIT',   val: 0 },
  look:    { label: 'Appearance',         ic: '1F483', macro: 'LOOK',    val: 0 },
  size:    { label: 'Size & shape',       ic: '1F418', macro: 'SIZE',    val: 0 },
  quality: { label: 'Opinions & quality', ic: '2B50',  macro: 'QUAL',    val: 0 },
  sense:   { label: 'Senses & things',    ic: '1F443', macro: 'SENSE',   val: 0 },
  world:   { label: 'Time, speed & money', ic: '23F0', macro: 'WORLD',   val: 0 },
  colour:  { label: 'Colours',            ic: '1F308', macro: 'COLOUR',  val: 0 },
  weather: { label: 'Weather',            ic: '1F326', macro: 'WEATHER', val: 0 }
};
const CAT_ORDER = Object.keys(CATS);
/** macros whose words could be confused with each other: never mixed in an odd-one-out question */
const MACRO_ADJ = {
  FEEL: ['BODY', 'TRAIT', 'QUAL'], BODY: ['FEEL', 'QUAL', 'TRAIT'], TRAIT: ['FEEL', 'QUAL', 'LOOK'], LOOK: ['SIZE', 'TRAIT', 'COLOUR', 'QUAL'],
  SIZE: ['LOOK', 'SENSE', 'QUAL'], QUAL: ['TRAIT', 'SENSE', 'WORLD', 'FEEL'], SENSE: ['QUAL', 'SIZE', 'WORLD', 'WEATHER', 'COLOUR'],
  WORLD: ['QUAL', 'SENSE', 'LOOK'], COLOUR: ['LOOK', 'SENSE'], WEATHER: ['SENSE']
};
const LEVEL_SETS = { easy: [1], medium: [1, 2], hard: [2, 3], mixed: [1, 2, 3] };
const LEVEL_LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard', mixed: 'Mixed' };

const WORDS = WORDS_DATA.map(r => ({
  w: r.w, ca: r.ca, cat: r.c, l: r.l, ic: r.i || '', face: !!r.f, syn: r.s, opp: r.o, def: r.d, ex: r.e,
  macro: CATS[r.c].macro
}));
const WMAP = new Map(WORDS.map(x => [x.w, x]));
const byWord = w => WMAP.get(w);
/** hand-written gap-fill sentences: GAPS.get(word) = { s: sentence with ___, h: [hard wrong answers], e: [easy wrong answers] } */
const GAPS = new Map(GAPS_DATA.filter(g => WMAP.has(g.w)).map(g => [g.w, g]));

/* symmetric relations, restricted to words that exist */
const SYN = new Map(), OPP = new Map();
WORDS.forEach(x => { SYN.set(x.w, new Set()); OPP.set(x.w, new Set()); });
WORDS.forEach(x => {
  x.syn.forEach(y => { if (WMAP.has(y) && y !== x.w) { SYN.get(x.w).add(y); SYN.get(y).add(x.w); } });
  x.opp.forEach(y => { if (WMAP.has(y) && y !== x.w) { OPP.get(x.w).add(y); OPP.get(y).add(x.w); } });
});
const synOf = w => Array.from(SYN.get(w) || []);
const oppOf = w => Array.from(OPP.get(w) || []);
/* -ed / -ing pairs (bored/boring): never offered as wrong answers for each other, because students mix them up */
const ED_ING = [['annoyed', 'annoying'], ['disappointed', 'disappointing'], ['embarrassed', 'embarrassing'], ['relaxed', 'relaxing'],
  ['confused', 'confusing'], ['shocked', 'shocking'], ['worried', 'worrying'], ['frightened', 'frightening'], ['terrified', 'terrifying'],
  ['surprised', 'surprising'], ['tired', 'tiring'], ['interested', 'interesting'], ['excited', 'exciting'], ['bored', 'boring'],
  ['amazed', 'amazing'], ['impressed', 'impressive'], ['stressed', 'stressful'], ['scared', 'scary']];
const EDG = new Map(WORDS.map(x => [x.w, new Set()]));
ED_ING.forEach(([a, b]) => { if (WMAP.has(a) && WMAP.has(b)) { EDG.get(a).add(b); EDG.get(b).add(a); } });
const related = (a, b) => SYN.get(a).has(b) || OPP.get(a).has(b) || EDG.get(a).has(b);

const NEAR_CACHE = new Map();
/** every word within two steps (synonym/opposite links): never offered as a wrong answer for `w` */
function near(w) {
  let s = NEAR_CACHE.get(w);
  if (s) return s;
  s = new Set([w]);
  let frontier = [w];
  for (let d = 0; d < 2; d++) {
    const nxt = [];
    frontier.forEach(a => [SYN.get(a), OPP.get(a), EDG.get(a)].forEach(set => set.forEach(b => { if (!s.has(b)) { s.add(b); nxt.push(b); } })));
    frontier = nxt;
  }
  NEAR_CACHE.set(w, s);
  return s;
}

/* ---------- per-word statistics (class-wide, saved in the browser) ---------- */
function noteResult(word, ok) {
  const s = ST.words[word] || (ST.words[word] = { ok: 0, ko: 0 });
  if (ok) s.ok++; else s.ko++;
  save();
}
function missedWords(limit) {
  return Object.keys(ST.words).filter(w => WMAP.has(w) && ST.words[w].ko > ST.words[w].ok)
    .sort((a, b) => (ST.words[b].ko - ST.words[b].ok) - (ST.words[a].ko - ST.words[a].ok))
    .slice(0, limit || 50).map(byWord);
}

/* ============================================================
   Adjectivia — question generator
   A question is:
   { type, word, lead, big, bigIcon, sentence, speakText, options:[{label,ic,w}], iconOptions,
     answer, hintCa:[[en,ca]], explain }
   Wrong answers never come from near(word): words linked by two synonym/opposite steps.
   ============================================================ */
const adjacent = (a, b) => a === b || (MACRO_ADJ[a] || []).includes(b) || (MACRO_ADJ[b] || []).includes(a);
const RECENT = [];
function remember(w) { RECENT.push(w); if (RECENT.length > 70) RECENT.shift(); }

/* faces that look too alike to be offered together (icon codes) */
const FACE_CLASH = [['1F922', '1F92E'], ['1F644', '1F611'], ['1F612', '1F611'], ['1F615', '1F61F'], ['1F641', '1F61F'], ['1F97A', '1F61F'],
  ['1F625', '1F61F'], ['1F62E', '1F632'], ['1F62E', '1F92F'], ['1F631', '1F628'], ['1F631', '1F632'], ['1F630', '1F625'], ['1F62B', '1F971'],
  ['1F62B', '1F629'], ['1F634', '1F971'], ['1F615', '1F914'], ['1F633', '1F62C'], ['1F611', '1F971'], ['1F620', '1F612'], ['1F612', '1F644']];
const clash = (a, b) => a === b || FACE_CLASH.some(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));
/* easy-to-tell-apart faces, used as wrong answers on Easy/Medium */
const CORE_FACES = new Set(['happy', 'sad', 'angry', 'scared', 'surprised', 'tired', 'sick', 'excited', 'bored', 'worried', 'confused']);

function blankOut(ex, word) {
  const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(^|[^A-Za-z-])' + esc + '(?![A-Za-z-])', 'i');
  if (!re.test(ex)) return null;
  return ex.replace(re, (all, pre) => pre + '_____');
}
const maxLevel = c => Math.max.apply(null, c.levels);

/** `n` wrong answers for target `t`, none of them near(t); `filter` narrows further. */
function distract(t, n, filter, c, extraNo) {
  const nr = near(t.w), no = new Set(extraNo || []);
  let pool = WORDS.filter(x => x.w !== t.w && !nr.has(x.w) && !no.has(x.w) && (!filter || filter(x)));
  const lv = pool.filter(x => c.levels.includes(x.l));
  if (lv.length >= n + 4) pool = lv;
  if (c.close) {
    const same = pool.filter(x => x.macro === t.macro);
    if (same.length >= n) pool = same;
  }
  if (pool.length < n) return null;
  return sample(pool, n);
}
function mkOptions(right, wrongs) {
  const all = shuffle([right].concat(wrongs));
  return { options: all.map(x => ({ label: x.w, ic: x.ic, w: x.w })), answer: all.indexOf(right) };
}
const caPairs = list => list.map(x => [x.w, x.ca]);
const friendly = (cands, c) => {
  const ok = cands.filter(x => x.l <= maxLevel(c) + 1);
  return pick(ok.length ? ok : cands);
};

/* Feeling groups are dense: a chain like heartbroken - devastated ... delighted - pleased - glad can reach far.
   So in a synonym/opposite question no wrong answer may belong to the mood group of the question word or of its answer. */
const MOOD_CATS = new Set(['joy', 'sad', 'angry', 'fear']);
const moodClash = (x, t, right) => MOOD_CATS.has(x.cat) && (x.cat === t.cat || x.cat === right.cat);

const QT = {
  syn(t, c) {
    const cands = synOf(t.w).map(byWord);
    if (!cands.length) return null;
    const right = friendly(cands, c);
    const wr = distract(t, 3, x => !moodClash(x, t, right), c, [right.w]); if (!wr) return null;
    const o = mkOptions(right, wr);
    return Object.assign({ type: 'syn', word: t.w, lead: 'Which word means almost the SAME as', big: t.w, speakText: t.w,
      hintCa: [[t.w, t.ca]], explain: t.w + ' ≈ ' + right.w + '  (' + t.ca + ' ≈ ' + right.ca + ')' }, o);
  },
  opp(t, c) {
    const cands = oppOf(t.w).map(byWord);
    if (!cands.length) return null;
    const right = friendly(cands, c);
    const wr = distract(t, 3, x => !moodClash(x, t, right), c, [right.w]); if (!wr) return null;
    const o = mkOptions(right, wr);
    return Object.assign({ type: 'opp', word: t.w, lead: 'Which word is the OPPOSITE of', big: t.w, speakText: t.w,
      hintCa: [[t.w, t.ca]], explain: t.w + ' ↔ ' + right.w + '  (' + t.ca + ' ↔ ' + right.ca + ')' }, o);
  },
  def(t, c) {
    const wr = distract(t, 3, null, c); if (!wr) return null;
    const o = mkOptions(t, wr);
    return Object.assign({ type: 'def', word: t.w, lead: 'Which adjective means', big: '“' + cap(t.def) + '”', speakText: '',
      hintCa: caPairs([t].concat(wr)), explain: t.w + ' = ' + t.def + '  (' + t.ca + ')' }, o);
  },
  /* sentence from the hand-written bank: Easy = 3 easy wrongs, Medium = 1 hard + 2 easy, Hard = 2 hard + 1 easy */
  gap(t, c) {
    const g = GAPS.get(t.w); if (!g) return null;
    const lvl = maxLevel(c), nHard = lvl >= 3 ? 2 : lvl === 2 ? 1 : 0;
    const hard = sample(g.h.filter(w => WMAP.has(w)), nHard);
    const easy = sample(g.e.filter(w => WMAP.has(w)), 3 - hard.length);
    if (hard.length + easy.length < 3) return null;
    const wrongs = hard.concat(easy).map(byWord);
    const o = mkOptions(t, wrongs);
    const sentence = g.s.replace('___', '_____');
    return Object.assign({ type: 'gap', word: t.w, lead: 'Choose the best word to complete the sentence', sentence, speakText: '',
      hintCa: caPairs([t].concat(wrongs)), explain: g.s.replace('___', t.w) + '  (' + t.w + ' = ' + t.ca + ')' }, o);
  },
  face(t, c) {
    if (!t.face) return null;
    const fp = pickFaces(t, 3, c); if (!fp) return null;
    const o = mkOptions(t, fp);
    return Object.assign({ type: 'face', word: t.w, lead: 'How does this person feel?', bigIcon: t.ic, speakText: '',
      hintCa: caPairs([t].concat(fp)), explain: t.w + ' = ' + t.ca }, o);
  },
  faceRev(t, c) {
    if (!t.face) return null;
    const fp = pickFaces(t, 3, c); if (!fp) return null;
    const o = mkOptions(t, fp);
    return Object.assign({ type: 'faceRev', word: t.w, lead: 'Which face shows', big: t.w, speakText: t.w, iconOptions: true,
      hintCa: [[t.w, t.ca]], explain: t.w + ' = ' + t.ca }, o);
  },
  listen(t, c) {
    const wr = distract(t, 3, x => Math.abs(x.w.length - t.w.length) < 6, c); if (!wr) return null;
    const o = mkOptions(t, wr);
    return Object.assign({ type: 'listen', word: t.w, lead: 'Listen, then choose the word you hear', speakText: t.w, listenBtn: true,
      hintCa: caPairs([t].concat(wr)), explain: t.w + ' = ' + t.ca }, o);
  }
};
/* wrong faces: different mood group, distinct pictures, not easily confused with the target's face */
function pickFaces(t, n, c) {
  const nr = near(t.w);
  const easy = maxLevel(c) < 3;
  let pool = WORDS.filter(x => x.face && x.cat !== t.cat && !nr.has(x.w) && !clash(x.ic, t.ic) && (!easy || CORE_FACES.has(x.w)));
  if (pool.length < n + 2) pool = WORDS.filter(x => x.face && x.cat !== t.cat && !nr.has(x.w) && !clash(x.ic, t.ic));
  const out = [];
  for (const x of shuffle(pool)) {
    if (out.length === n) break;
    if (out.some(y => y.cat === x.cat || clash(y.ic, x.ic))) continue;
    out.push(x);
  }
  return out.length === n ? out : null;
}

/* odd one out: three words of one group and one that clearly does not belong */
/* Words that cannot also describe a feeling or a personality (so "the odd one" is never arguable):
   plain shapes, most weather words and a few colours. */
const OOO_SHAPES = ['round', 'square', 'wide', 'long', 'narrow'];
const OOO_WEATHER = ['rainy', 'windy', 'snowy', 'cloudy'];
const OOO_COLOURS = ['orange', 'pink', 'purple', 'brown', 'grey', 'white', 'black'];
const OOO_SPECS = [
  { base: ['FEEL'], odd: x => OOO_SHAPES.includes(x.w) || OOO_WEATHER.includes(x.w) },
  { base: ['TRAIT'], odd: x => OOO_SHAPES.includes(x.w) || OOO_WEATHER.includes(x.w) || OOO_COLOURS.includes(x.w) },
  { base: ['LOOK', 'SIZE'], odd: x => x.macro === 'FEEL' || x.macro === 'TRAIT' },
  { base: ['COLOUR'], odd: x => ['FEEL', 'TRAIT', 'WEATHER'].includes(x.macro) || OOO_SHAPES.includes(x.w) },
  { base: ['WEATHER'], odd: x => ['FEEL', 'TRAIT', 'COLOUR'].includes(x.macro) || OOO_SHAPES.includes(x.w) }
];
function oddOneOut(c) {
  for (let tries = 0; tries < 20; tries++) {
    const spec = pick(OOO_SPECS), base = spec.base;
    const baseWords = WORDS.filter(x => base.includes(x.macro) && c.levels.includes(x.l));
    if (baseWords.length < 3) continue;
    const odds = WORDS.filter(x => !base.includes(x.macro) && spec.odd(x) && x.l <= maxLevel(c) && !c.used.has(x.w));
    if (!odds.length) continue;
    const odd = pick(odds);
    const three = [];
    for (const x of shuffle(baseWords)) {
      if (three.length === 3) break;
      if (x.w === odd.w || related(x.w, odd.w) || three.some(y => y.w === x.w)) continue;
      three.push(x);
    }
    if (three.length < 3) continue;
    const o = mkOptions(odd, three);
    const grp = { FEEL: 'feelings', TRAIT: 'personality words', LOOK: 'words about appearance', COLOUR: 'colours', WEATHER: 'weather words' }[base[0]];
    return Object.assign({ type: 'ooo', word: odd.w, lead: 'Which word does NOT belong with the others?', speakText: '',
      hintCa: caPairs([odd].concat(three)), explain: odd.w + ' is the odd one out: the others are ' + grp + '.' }, o);
  }
  return null;
}

/* ---------- target selection ---------- */
const TARGET_OK = {
  syn: x => SYN.get(x.w).size > 0, opp: x => OPP.get(x.w).size > 0, def: () => true,
  gap: x => GAPS.has(x.w), face: x => x.face, faceRev: x => x.face, listen: () => true, ooo: () => true
};
/**
 * ctx = { levels:[1..3], types:[...], used:Set, close:bool }
 * Returns a question or null when nothing fits.
 */
function nextQuestion(ctx) {
  ctx.used = ctx.used || new Set();
  const tried = new Set();       // targets that could not make a question this time: never retry them in this call
  for (let attempt = 0; attempt < 80; attempt++) {
    if (attempt === 40) ctx.used.clear();
    const type = pick(ctx.types);
    if (type === 'listen' && !ttsReady()) continue;
    let q = null;
    if (type === 'ooo') q = oddOneOut(ctx);
    else {
      let pool = WORDS.filter(x => ctx.levels.includes(x.l) && TARGET_OK[type](x) && !ctx.used.has(x.w) && !tried.has(type + x.w));
      if (!pool.length) continue;
      const fresh = pool.filter(x => !RECENT.includes(x.w));
      if (fresh.length >= 4) pool = fresh;
      const missed = missedWords(40).filter(x => pool.includes(x));
      const t = missed.length && Math.random() < 0.2 ? pick(missed) : pick(pool);
      q = QT[type](t, ctx);
      if (!q) tried.add(type + t.w);
    }
    if (q) { ctx.used.add(q.word); remember(q.word); return q; }
  }
  return null;
}
/** build `n` questions in one go (used by round-based modes) */
function questionSet(n, ctx) {
  const out = [];
  for (let i = 0; i < n; i++) { const q = nextQuestion(ctx); if (q) out.push(q); }
  return out;
}

/* ============================================================
   Adjectivia — shared UI: screens, players, XP & trophies, scoreboard, podium, question view
   ============================================================ */
const app = $('#app');
let leaveFns = [];
function onLeave(fn) { leaveFns.push(fn); }
/**
 * Replaces the whole screen. Everything that belongs to the old screen (timers, keys, speech) is stopped first.
 * `build` is a node, or a function returning one: use a function whenever the screen creates timers or key
 * handlers while it is being built, so they are registered AFTER the old ones were cleared.
 */
function render(build, crumb) {
  Timers.clear(); Keys.clear();
  leaveFns.forEach(f => { try { f(); } catch (e) { /* ignore */ } }); leaveFns = [];
  closeModal(true);
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  const node = typeof build === 'function' ? build() : build;
  app.replaceChildren(node);
  $('#crumb').textContent = crumb || '';
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalEl && !modalEl.dataset.lock) closeModal(); });

/* ---------- ranks & XP ---------- */
const RANKS = [
  { xp: 0, name: 'Beginner', ic: '1F331' }, { xp: 100, name: 'Word Explorer', ic: '1F9ED' },
  { xp: 300, name: 'Adjective Apprentice', ic: '1F4DD' }, { xp: 700, name: 'Describer', ic: '1F3A8' },
  { xp: 1500, name: 'Wordsmith', ic: '1F528' }, { xp: 3000, name: 'Adjective Hero', ic: '1F9B8' },
  { xp: 6000, name: 'Adjective Master', ic: '1F451' }
];
function rankIdx(xp) { let r = 0; RANKS.forEach((x, i) => { if (xp >= x.xp) r = i; }); return r; }
function rankInfo(pid) {
  const p = ST.players[pid], i = rankIdx(p.xp), cur = RANKS[i], nxt = RANKS[i + 1];
  return { rank: cur, next: nxt, pct: nxt ? Math.round(100 * (p.xp - cur.xp) / (nxt.xp - cur.xp)) : 100 };
}
function giveXP(pid, n) {
  n = Math.round(n); if (!(n > 0)) return;
  const p = ST.players[pid], before = rankIdx(p.xp);
  p.xp += n;
  if (G && G.xpGain) G.xpGain[pid] = (G.xpGain[pid] || 0) + n;
  const after = rankIdx(p.xp);
  if (after > before) {
    sfx("levelup"); confetti(50);
    toast(h('div', { class: 'tt' }, ico(RANKS[after].ic), h('div', null, h('b', null, pname(pid) + ' is now a'), h('div', { class: 'tt-big' }, RANKS[after].name))), 'gold');
  }
  if (p.xp >= 1000) award(pid, 'xp1000');
  save();
}

/* ---------- game session ---------- */
let G = null;
const PLAY_MODES = ['ladder', 'memory', 'match', 'faces', 'gap', 'speed', 'hotseat', 'hangman'];
function newGame(mode, pids) {
  G = { mode, pids: pids.slice(), scores: {}, correct: {}, wrong: {}, streak: {}, best: {}, missed: new Set(), extra: {}, xpGain: {}, live: true };
  pids.forEach(id => { G.scores[id] = 0; G.correct[id] = 0; G.wrong[id] = 0; G.streak[id] = 0; G.best[id] = 0; });
  return G;
}
/** records one answer. Returns the XP given. `hint` halves the reward. */
function recordAnswer(pid, word, ok, hint) {
  if (word) noteResult(word, ok);
  const p = ST.players[pid];
  if (ok) {
    G.correct[pid]++; G.streak[pid]++; p.correct++;
    if (G.streak[pid] > G.best[pid]) G.best[pid] = G.streak[pid];
    if (G.streak[pid] > p.bestStreak) p.bestStreak = G.streak[pid];
    if (G.streak[pid] >= 5) award(pid, 'streak5');
    if (G.streak[pid] >= 10) award(pid, 'streak10');
    const xp = (hint ? 4 : 8) + Math.min(G.streak[pid], 5);
    giveXP(pid, xp); return xp;
  }
  G.wrong[pid]++; G.streak[pid] = 0; p.wrong++;
  if (word) G.missed.add(word);
  save(); return 0;
}
function addScore(pid, n) { G.scores[pid] = Math.max(0, (G.scores[pid] || 0) + n); if (G.bar) G.bar.update(G.scores, G.cur); }

function avatar(pid, size) {

function scoreBar(pids, scores, fmt) {
  const bar = h('div', { class: 'scorebar' });
  const els = {}, last = {};
  pids.forEach(id => {
    const v = h('b', { class: 'sc-v' }, fmt ? fmt(scores[id] || 0) : (scores[id] || 0));

      last[id] = nv;
      els[id].classList.toggle('cur', id === cur);
    });
  };
  bar.update(scores, null);
  return bar;
}

/* ---------- countdown ---------- */
function countdown(secs, onEnd, opts) {
  opts = opts || {};
  let left = secs, total = secs, stopped = false, paused = false;
  const fill = h('i'), num = h('b', null, Math.ceil(left));
  const el = h('div', { class: 'cd' + (opts.big ? ' big' : '') }, h('div', { class: 'cd-bar' }, fill), num);
  const paint = () => {
    num.textContent = Math.max(0, Math.ceil(left));
    fill.style.width = clamp(100 * left / total, 0, 100) + '%';
    el.classList.toggle('low', left <= 5);
  };
  paint();
  const id = Timers.every(() => {
    if (stopped || paused) return;
    left -= 0.1; paint();
    if (opts.tick && left <= 5 && Math.abs(left - Math.round(left)) < 0.05) sfx('tick');
    if (left <= 0) { stopped = true; Timers.stop(id); onEnd && onEnd(); }
  }, 100);
  return { el, stop() { stopped = true; Timers.stop(id); }, pause() { paused = true; }, resume() { paused = false; }, add(n) { left += n; total = Math.max(total, left); paint(); }, left: () => left };
}

/* ---------- question view ---------- */
const LETTERS = ['A', 'B', 'C', 'D'];
/**
 * Renders a question. `onPick(i)` is called when an option is chosen (click or key A-D / 1-4).
 * Returns helpers to mark the result.
 */
function qView(q, onPick) {
  const wrap = h('div', { class: 'qv t-' + q.type });
  wrap.append(h('div', { class: 'q-lead' }, q.lead));
  const bigBox = h('div', { class: 'q-big' });
  if (q.sentence) {
    const parts = q.sentence.split('_____');
    bigBox.classList.add('sentence');
    bigBox.append(parts[0], h('span', { class: 'blank' }, '      '), parts.slice(1).join('_____'));
  } else if (q.bigIcon) {
    bigBox.classList.add('face'); bigBox.append(ico(q.bigIcon));
  } else if (q.listenBtn) {
    bigBox.classList.add('listen');
    bigBox.append(h('button', { class: 'btn-listen', onclick: () => speak(q.speakText), 'aria-label': 'Listen again' }, ico('1F50A'), ' Listen again'));
  } else if (q.big) {
    bigBox.append(q.big);
    if (q.speakText) bigBox.append(h('button', { class: 'say', title: 'Listen', 'aria-label': 'Listen', onclick: () => speak(q.speakText) }, ico('1F50A')));
  }
  wrap.append(bigBox);
  const opts = h('div', { class: 'q-opts' + (q.iconOptions ? ' icons' : '') });
  const btns = q.options.map((o, i) => {
    const b = h('button', { class: 'opt c' + i, 'data-i': i, onclick: () => { if (!b.disabled) onPick(i); } },
      h('span', { class: 'letter' }, LETTERS[i]),
      q.iconOptions ? ico(o.ic) : h('span', { class: 'olabel' }, o.label));
    return b;
  });
  btns.forEach(b => opts.append(b));
  wrap.append(opts);
  const hint = h('div', { class: 'q-hint' });
  wrap.append(hint);
  const keyFn = e => {
    const k = e.key.toLowerCase();
    let i = ['a', 'b', 'c', 'd'].indexOf(k); if (i < 0) i = ['1', '2', '3', '4'].indexOf(k);
    if (i >= 0 && btns[i] && !btns[i].disabled) { onPick(i); return true; }
    return false;
  };
  Keys.on(keyFn);
  const api = {
    el: wrap, btns,
    destroy() { Keys.off(keyFn); },
    select(i) { btns.forEach((b, j) => b.classList.toggle('sel', j === i)); },
    disable(on) { btns.forEach(b => { b.disabled = on; }); },
    eliminate(i) { btns[i].classList.add('gone'); btns[i].disabled = true; },
    markWrong(i) { btns[i].classList.add('wrong'); btns[i].disabled = true; },
    /** shows the verdict. `chosen` may be -1 (time up) */
    reveal(chosen) {
      api.disable(true);
      btns.forEach((b, j) => { b.classList.remove('sel'); if (j === q.answer) b.classList.add('right'); else if (j === chosen) b.classList.add('wrong'); });
      if (q.sentence) {
        const bl = $('.blank', wrap);
        if (bl) { bl.textContent = q.options[q.answer].label; bl.classList.add('filled'); }
      }
    },
    showHint() {
      hint.replaceChildren(h('b', null, 'En català: '), q.hintCa.map(p => h('span', { class: 'chip' }, p[0] + ' = ' + p[1])));
      hint.classList.add('on');
    },
    showExplain(ok) {
      hint.classList.add('on', ok ? 'okx' : 'kox');
      hint.replaceChildren(h('span', null, q.explain));
    }
  };
  if (q.listenBtn) Timers.set(() => speak(q.speakText), 350);
  return api;
}
function hintButton(onClick) {
  const b = h('button', { class: 'btn-hint', title: 'Show the Catalan translation (half points)', onclick: () => { b.disabled = true; sfx('click'); onClick(); } }, '?', h('small', null, ' català'));
  return b;
}

/* ---------- finishing a game: XP, trophies, podium ---------- */
function finishGame(opts) {
  // opts: { title, subtitle, order:[pid sorted best first], scoreText:(pid)=>string, again:fn, note:Node, mvpLabel }
  const pids = G.pids, multi = pids.length > 1;
  const order = opts.order || pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
  pids.forEach(id => {
    const p = ST.players[id];
    p.games++; p.modes[G.mode] = (p.modes[G.mode] || 0) + 1;
    award(id, 'first');
    giveXP(id, 20);
    if (PLAY_MODES.every(m => p.modes[m])) award(id, 'allModes');
  });
  let winners = [];
  if (multi) {
    const top = opts.scoreOf ? opts.scoreOf(order[0]) : G.scores[order[0]];
    winners = order.filter(id => (opts.scoreOf ? opts.scoreOf(id) : G.scores[id]) === top);
    if (top > 0 && winners.length < pids.length) winners.forEach(id => { award(id, 'winner'); giveXP(id, 30); });
  }
  save();
  showPodium(Object.assign({}, opts, { order, winners }));
}
function showPodium(o) {
  G.live = false;
  const order = o.order, wrap = h('div', { class: 'podium-screen' });
  wrap.append(h('h2', { class: 'pod-title' }, o.title || 'Game over!'));
  if (o.subtitle) wrap.append(h('p', { class: 'pod-sub' }, o.subtitle));
  const top3 = order.slice(0, 3);
  const arrangement = top3.length === 3 ? [1, 0, 2] : top3.length === 2 ? [1, 0] : [0];
  const steps = h('div', { class: 'podium' });
  arrangement.forEach(rank => {
    const id = top3[rank];
    const st = h('div', { class: 'pstep r' + (rank + 1) + (o.winners && o.winners.includes(id) ? ' win' : ''), style: '--pc:' + PCOLORS[id] },
      h('div', { class: 'p-medal' }, ico(['1F947', '1F948', '1F949'][rank])),
      avatar(id, 'xl'), h('div', { class: 'p-name' }, pname(id)),
      h('div', { class: 'p-score' }, o.scoreText ? o.scoreText(id) : G.scores[id] + ' pts'),
      h('div', { class: 'p-block' }, String(rank + 1)));
    steps.append(st);
  });
  wrap.append(steps);
  if (order.length > 3) {
    wrap.append(h('div', { class: 'pod-rest' }, order.slice(3).map((id, i) => h('div', { class: 'sc', style: '--pc:' + PCOLORS[id] },
      h('b', null, (i + 4) + '.'), avatar(id, 'sm'), h('span', { class: 'sc-n' }, pname(id)), h('b', { class: 'sc-v' }, o.scoreText ? o.scoreText(id) : G.scores[id])))));
  }
  if (G.pids.length > 1) {
    const best = G.pids.slice().sort((a, b) => G.correct[b] - G.correct[a])[0];
    if (G.correct[best] > 0) wrap.append(h('p', { class: 'mvp' }, ico('2B50'), ' Most correct answers: ', h('b', null, pname(best)), ' (' + G.correct[best] + ')'));
  }
  if (o.note) wrap.append(o.note);
  if (G.xpGain && G.pids.some(id => G.xpGain[id])) {          // experience of every player in this game
    wrap.append(h('div', { class: 'xp-panel' }, h('h3', null, ico('2B50'), ' Experience earned'), G.pids.map(id => {
      const ri = rankInfo(id), p = ST.players[id];
      return h('div', { class: 'xp-row', style: '--pc:' + PCOLORS[id] }, avatar(id, 'sm'), h('b', null, pname(id)),
        h('span', { class: 'xp-gain' }, '+' + Math.round(G.xpGain[id] || 0) + ' XP'),
        h('span', { class: 'xp-rank' }, ico(ri.rank.ic, 'tiny'), ' ' + ri.rank.name),
        h('div', { class: 'xpbar' }, h('i', { style: 'width:' + ri.pct + '%' })),
        h('small', null, p.xp + ' XP' + (ri.next ? ' · next rank at ' + ri.next.xp : ' · top rank!')));
    })));
  }
  const missed = Array.from(G.missed).map(byWord).filter(Boolean);
  if (missed.length) {
    wrap.append(h('div', { class: 'review' }, h('h3', null, ico('1F4DA'), ' Words to review'),
      h('div', { class: 'chips' }, missed.slice(0, 14).map(w => h('button', { class: 'chip big', onclick: () => speak(w.w), title: 'Listen' }, w.w, h('small', null, ' = ' + w.ca))))));
  }
  const acts = h('div', { class: 'actions' });
  if (o.again) acts.append(h('button', { class: 'btn primary', onclick: o.again }, ico('1F501'), ' Play again'));
  acts.append(h('button', { class: 'btn', onclick: () => showHub() }, ico('1F3E0'), ' Home'));
  wrap.append(acts);
  render(wrap, o.title || 'Results');
  sfx("win"); confetti(110, innerWidth / 2, innerHeight * 0.3);
  Timers.set(() => confetti(50, innerWidth * 0.2, innerHeight * 0.35), 500);
  Timers.set(() => confetti(50, innerWidth * 0.8, innerHeight * 0.35), 800);
}

/* ---------- generic setup screen ---------- */
function chipRow(opt, cfg, save2) {
  const row = h('div', { class: 'chip-row' });
  opt.choices.forEach(ch => {
    const b = h('button', { class: 'choice' + (cfg[opt.key] === ch.v ? ' on' : ''), onclick: () => {

      save2();
    } }, h('b', null, ch.label), ch.desc ? h('small', null, ch.desc) : null);
    row.append(b);

/**
 * def: { id, name, ic, desc, rules:[], options:[{key,label,choices:[{v,label,desc}], def}], minPlayers, onStart(cfg, pids) }
 */
function setupScreen(def) {
  const saved = ST.prefs[def.id] || {}, cfg = {};
  const opts = def.options.slice();
  if (ST.active > 1 && !def.noOrder) opts.push({ key: 'order', label: 'Who starts?', choices: [{ v: 'list', label: 'In order' }, { v: 'random', label: 'Random' }], def: 'list' });
  opts.forEach(o => { cfg[o.key] = o.choices.some(c => c.v === saved[o.key]) ? saved[o.key] : o.def; });
  const wrap = h('div', { class: 'setup' });
  wrap.append(h('div', { class: 'setup-head' }, ico(def.ic, 'xl'), h('div', null, h('h2', null, def.name), h('p', null, def.desc))));
  const body = h('div', { class: 'setup-body' });
  opts.forEach(o => body.append(h('div', { class: 'opt-group' }, h('h4', null, o.label), chipRow(o, cfg, () => { ST.prefs[def.id] = Object.assign({}, cfg); save(); }))));
  wrap.append(body);
  if (def.rules && def.rules.length) wrap.append(h('ul', { class: 'rules' }, def.rules.map(r => h('li', null, r))));
  const pids = activePlayers().map(p => p.id);
  const need = def.minPlayers || 1;
  const row = h('div', { class: 'who-row' }, h('span', null, 'Players: '), pids.map(id => h('span', { class: 'who', style: '--pc:' + PCOLORS[id] }, avatar(id, 'sm'), pname(id))),
    h('button', { class: 'btn small', onclick: () => showPlayers(() => setupScreen(def)) }, 'Change'));
  wrap.append(row);
  const acts = h('div', { class: 'actions' },
    h('button', { class: 'btn', onclick: () => showHub() }, '← Back'),
    h('button', { class: 'btn primary big', id: 'btn-go', disabled: pids.length < need, onclick: () => {
      ST.prefs[def.id] = Object.assign({}, cfg); save(); sfx('start');
      let order = pids.slice(); if (cfg.order === 'random') order = shuffle(order);
      def.onStart(cfg, order);
    } }, ico('25B6'), ' Start'));
  if (pids.length < need) wrap.append(h('p', { class: 'warn' }, 'This mode needs at least ' + need + ' players.'));
  wrap.append(acts);
  render(wrap, def.name);
}

/* ---------- export / import of profiles (a plain .json file) ---------- */
function exportPayload(indices) {
  return { app: 'adjectivia', format: 1, version: VERSION, exported: new Date().toISOString(),
    profiles: indices.map(i => JSON.parse(JSON.stringify(ST.profiles[i]))) };
}
/** Reads the text of an exported file. Returns the list of cleaned profiles, or throws an Error with a readable message. */
function parseProfilesFile(text) {
  let o; try { o = JSON.parse(text); } catch (e) { throw new Error('This file is not a valid Adjectivia profiles file.'); }
  if (!o || o.app !== 'adjectivia' || !Array.isArray(o.profiles) || !o.profiles.length) throw new Error('This file does not contain Adjectivia profiles.');
  if (o.profiles.length > MAX_PROFILES) throw new Error('The file has too many profiles.');
  return { exported: o.exported || '', profiles: o.profiles.map((p, i) => normaliseProfile(p, i)) };
}
function exportProfiles(indices) {
  const data = exportPayload(indices);
  const day = new Date().toISOString().slice(0, 10);
  const one = indices.length === 1 ? profileLabel(ST.profiles[indices[0]], indices[0]).replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') : 'all-profiles';
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: 'adjectivia-' + (one || 'profile') + '-' + day + '.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Saved ' + indices.length + (indices.length === 1 ? ' profile' : ' profiles') + ' to a file', 'good');
}
function readImportFile(file) {
  if (file.size > 5e6) return toast('That file is too big', 'bad');
  const rd = new FileReader();
  rd.onload = () => {
    let res; try { res = parseProfilesFile(String(rd.result)); } catch (e) { return toast(e.message, 'bad'); }
    confirmImport(res.profiles);
  };
  rd.onerror = () => toast('Could not read the file', 'bad');
  rd.readAsText(file);
}

/* ============================================================
   Mode 1 — Golden Ladder (15 questions, safe steps, 5 lifelines)
   ============================================================ */
const PRIZES = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 250000, 500000, 1000000];
const SAFE_AT = [4, 9];                       // indexes of the safe steps
const fmtPts = n => n.toLocaleString('en-GB');
const LIFELINES = [
  { id: 'fifty', ic: null, label: 'Half', tip: '50:50 — removes two wrong answers.' },
  { id: 'audience', ic: '1F465', label: 'Ask the class', tip: 'The class votes by raising hands.' },
  { id: 'phone', ic: '1F4DE', label: 'Phone a friend', tip: 'A classmate helps you for 30 seconds.' },
  { id: 'swap', ic: '1F500', label: 'Swap', tip: 'Change this question for a new one.' },
  { id: 'double', ic: '1F340', label: 'Double chance', tip: 'If your first answer is wrong, try again.' }
];
let L = null;      // ladder state

function setupLadder() {
  setupScreen({
    id: 'ladder', name: 'Golden Ladder', ic: '1F3C6',
    desc: 'Climb 15 steps from easy to very hard adjective questions. Use your lifelines wisely!',
    options: [
      { key: 'style', label: 'How do we play?', def: 'relay', choices: [
        { v: 'relay', label: 'Team relay', desc: 'One ladder for everybody. Players answer in turns and share the lifelines.' },
        { v: 'solo', label: 'One by one', desc: 'Every player climbs their own ladder with their own lifelines.' }] },
      { key: 'timer', label: 'Time per question', def: 0, choices: [{ v: 0, label: 'No limit' }, { v: 60, label: '60 s' }, { v: 30, label: '30 s' }] }
    ],
    rules: ['Steps 5 and 10 are safe: if you fall, you keep those points.', 'You can walk away at any moment and keep what you have.',
      'Use A-D or 1-4 on the keyboard to answer; Enter confirms.'],
    onStart: startLadder
  });
}
function startLadder(cfg, pids) {
  newGame('ladder', pids);
  L = { cfg, pids, style: pids.length === 1 ? 'solo' : cfg.style, qi: 0, runIdx: 0, turn: 0, results: [], used: new Set(), life: null, team: 0 };
  G.cur = null;
  beginRun();
}
function curPid() { return L.style === 'solo' ? L.pids[L.runIdx] : L.pids[L.turn % L.pids.length]; }
function freshLife() { return { fifty: true, audience: true, phone: true, swap: true, double: true }; }
function beginRun() {
  L.qi = 0; L.turn = 0; L.life = freshLife(); L.used = new Set(); L.team = 0;
  if (L.style === 'solo') {
    const pid = L.pids[L.runIdx];
    const w = h('div', { class: 'intro' }, avatar(pid, 'xxl'), h('h2', null, pname(pid) + ', it’s your turn!'),
      h('p', null, 'Climb the Golden Ladder. 15 questions, 5 lifelines.'),
      h('button', { class: 'btn primary big', onclick: () => { sfx('start'); askQuestion(); } }, ico('25B6'), ' Start climbing'));
    render(w, 'Golden Ladder');
    sfx('start');
  } else askQuestion();
}
function levelsFor(qi) {
  const r = Math.random();
  if (qi < 5) return r < 0.25 && qi > 2 ? [1, 2] : [1];
  if (qi < 10) return r < 0.3 ? [1, 2] : [2];
  return r < 0.3 ? [2, 3] : [3];
}
function typesFor(qi) {
  if (qi < 2) return ['syn', 'opp', 'def', 'face', 'faceRev', 'listen'];
  if (qi < 5) return ['syn', 'opp', 'def', 'face', 'faceRev', 'gap', 'listen'];
  if (qi < 10) return ['syn', 'opp', 'def', 'gap', 'gap', 'ooo', 'face', 'listen'];
  return ['syn', 'opp', 'def', 'gap', 'gap', 'ooo', 'face'];
}
function makeLadderQuestion() {
  const ctx = { levels: levelsFor(L.qi), types: typesFor(L.qi), used: L.used, close: L.qi >= 10 };
  return nextQuestion(ctx) || nextQuestion({ levels: [1, 2, 3], types: ['def', 'syn'], used: new Set() });
}
function safePrize(qi) { return qi > SAFE_AT[1] ? PRIZES[SAFE_AT[1]] : qi > SAFE_AT[0] ? PRIZES[SAFE_AT[0]] : 0; }
function walkPrize(qi) { return qi > 0 ? PRIZES[qi - 1] : 0; }

function askQuestion() {
  const q = makeLadderQuestion();
  if (!q) { toast('Could not make a question', 'bad'); return endRun('win'); }
  const pid = curPid();
  G.cur = pid;
  const S = { q, locked: false, double: false, usedSecond: false, hint: false, pending: -1, qv: null, timer: null };
  let confirmBar;
  const build = () => {
  const fmt = L.style === 'solo' ? fmtPts : null;
  const bar = scoreBar(L.pids, G.scores, fmt);
  G.bar = bar; bar.update(G.scores, pid);

  const who = h('div', { class: 'who-banner', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'md'),
    h('div', null, h('b', null, pname(pid)), h('small', null, 'Question ' + (L.qi + 1) + ' of 15 · for ' + fmtPts(PRIZES[L.qi]) + ' points')));
  const main = h('div', { class: 'ladder-main' });
  main.append(who);
  if (L.cfg.timer) {
    S.timer = countdown(L.cfg.timer, () => { if (!S.locked) lockIn(-1); }, { tick: true });
    main.append(S.timer.el);
  }
  S.qv = qView(q, i => onPick(i));
  main.append(S.qv.el);
  confirmBar = h('div', { class: 'confirm-bar', hidden: true });
  const hintBtn = hintButton(() => { S.hint = true; S.qv.showHint(); });
  const walk = h('button', { class: 'btn small', onclick: () => walkAway() }, ico('1F6D1'), ' Take ' + fmtPts(walkPrize(L.qi)) + ' & stop');
  main.append(confirmBar, h('div', { class: 'under-q' }, hintBtn, walk));

  // side column
  const life = h('div', { class: 'lifelines' });
  LIFELINES.forEach(ll => {
    const b = h('button', { class: 'life', disabled: !L.life[ll.id], title: ll.tip, 'aria-label': ll.label + '. ' + ll.tip, onclick: () => useLife(ll.id, S, b) },
      ll.ic ? ico(ll.ic) : h('span', { class: 'fifty' }, '50:50'), h('small', null, ll.label));
    life.append(b);
  });
  const ladder = h('ol', { class: 'prizes' });
  for (let i = 14; i >= 0; i--) {
    ladder.append(h('li', { class: (i === L.qi ? 'now ' : '') + (i < L.qi ? 'done ' : '') + (SAFE_AT.includes(i) ? 'safe' : '') },
      h('span', { class: 'n' }, i + 1), h('span', { class: 'v' }, fmtPts(PRIZES[i])), SAFE_AT.includes(i) ? ico('1F6E1', 'tiny') : null));
  }
  const side = h('aside', { class: 'ladder-side' }, life, ladder);
  const wrap = h('div', { class: 'ladder-wrap' }, bar, h('div', { class: 'ladder' }, main, side));
  Keys.on(confirmKeys);
  return wrap;
  };
  render(build, 'Golden Ladder');
  announce('Question ' + (L.qi + 1));
  if (q.speakText && q.type !== 'listen') Timers.set(() => speak(q.speakText), 400);

  function onPick(i) {
    if (S.locked) return;
    sfx('click');
    if (!ST.settings.confirm) return lockIn(i);
    S.pending = i; S.qv.select(i);
    confirmBar.hidden = false;
    confirmBar.replaceChildren(h('b', null, 'Final answer: ' + LETTERS[i] + ' — ' + (q.iconOptions ? '' : q.options[i].label) + '?'),
      h('button', { class: 'btn primary', onclick: () => lockIn(S.pending) }, 'Yes, lock it in'),
      h('button', { class: 'btn', onclick: () => { S.pending = -1; S.qv.select(-1); confirmBar.hidden = true; } }, 'No'));
  }
  function confirmKeys(e) {
    if (S.locked || S.pending < 0) return false;
    if (e.key === 'Enter' || e.key.toLowerCase() === 'y') { lockIn(S.pending); return true; }
    if (e.key.toLowerCase() === 'n') { S.pending = -1; S.qv.select(-1); confirmBar.hidden = true; return true; }
    return false;
  }

  function lockIn(i) {
    if (S.locked) return;
    S.locked = true; confirmBar.hidden = true;
    if (S.timer) S.timer.stop();
    S.qv.disable(true); S.qv.select(i);
    sfx('tick');
    Timers.set(() => verdict(i), i < 0 ? 100 : 1100);
  }
  function verdict(i) {
    const ok = i === q.answer;
    if (!ok && S.double && !S.usedSecond && i >= 0) {               // double chance: one more try
      S.usedSecond = true; S.locked = false; S.pending = -1; sfx('ko');
      S.qv.markWrong(i); S.qv.select(-1);
      S.qv.btns.forEach((b, j) => { if (!b.classList.contains('wrong') && !b.classList.contains('gone')) b.disabled = false; });
      toast('Double chance! Try once more.', 'gold');
      if (S.timer) S.timer.stop();
      return;
    }
    S.qv.reveal(i);
    S.qv.showExplain(ok);
    afterAnswerSpeak(q);
    recordAnswer(pid, q.word, ok, S.hint);
    if (ok) {
      sfx('ok'); confettiFrom(S.qv.btns[q.answer], 30);
      if (L.style === 'solo') addScore(pid, PRIZES[L.qi] - G.scores[pid]);
      else { addScore(pid, Math.round(100 * (L.qi + 1) * (S.hint ? 0.5 : 1))); L.team = PRIZES[L.qi]; }
      const victims = L.style === 'solo' ? [pid] : L.pids;
      if (L.qi === 4) victims.forEach(v => { award(v, 'ladder5'); giveXP(v, 20); });
      if (L.qi === 9) victims.forEach(v => { award(v, 'ladder10'); giveXP(v, 40); });
      if (L.qi === 14) victims.forEach(v => { award(v, 'ladder15'); giveXP(v, 100); });
      if (SAFE_AT.includes(L.qi)) { sfx('levelup'); confetti(70); toast('Safe step reached: ' + fmtPts(PRIZES[L.qi]) + ' points!', 'gold'); }
      Timers.set(() => {
        if (L.qi === 14) return endRun('win');
        L.qi++; L.turn++; askQuestion();
      }, 2200);
    } else {
      sfx('ko'); document.body.classList.add('shake'); Timers.set(() => document.body.classList.remove('shake'), 500);
      Timers.set(() => endRun(i < 0 ? 'time' : 'wrong'), 3200);
    }
  }
  function walkAway() {
    if (S.locked) return;
    openModal(h('div', null, h('h3', null, 'Take the points and stop?'), h('p', null, 'You will keep ' + fmtPts(walkPrize(L.qi)) + ' points.'),
      h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: closeModal }, 'Keep playing'),
        h('button', { class: 'btn primary', onclick: () => { closeModal(); S.locked = true; if (S.timer) S.timer.stop(); endRun('walk'); } }, 'Take them'))));
  }
}

/* ---------- lifelines ---------- */
function useLife(id, S, btn) {
  if (S.locked || !L.life[id]) return;
  const q = S.q;
  sfx('lifeline');
  if (id === 'fifty') {
    L.life.fifty = false; btn.disabled = true;
    const wrongs = [0, 1, 2, 3].filter(i => i !== q.answer && !S.qv.btns[i].classList.contains('gone'));
    sample(wrongs, 2).forEach(i => S.qv.eliminate(i));
    if (S.pending >= 0 && S.qv.btns[S.pending].classList.contains('gone')) S.pending = -1;
  } else if (id === 'double') {
    L.life.double = false; btn.disabled = true; S.double = true;
    $('.who-banner').append(h('span', { class: 'badge' }, ico('1F340'), ' Double chance on'));
    toast('Double chance: you may answer twice.', 'gold');
  } else if (id === 'swap') {
    L.life.swap = false; btn.disabled = true;
    S.locked = true; if (S.timer) S.timer.stop();
    toast('New question!', 'gold'); Timers.set(() => askQuestion(), 400);
  } else if (id === 'audience') {
    L.life.audience = false; btn.disabled = true;
    if (S.timer) S.timer.pause();                       // the question timer waits while the class votes
    audienceModal(q, () => { if (S.timer) S.timer.resume(); });
  } else if (id === 'phone') {
    L.life.phone = false; btn.disabled = true;
    if (S.timer) S.timer.pause();
    phoneModal(q, () => { if (S.timer) S.timer.resume(); });
  }
}

/* ---------- end of a climb ---------- */
function endRun(kind) {
  const pid = curPid();
  const reached = kind === 'win' ? 15 : L.qi;               // steps answered correctly
  const prize = kind === 'win' ? PRIZES[14] : kind === 'walk' ? walkPrize(L.qi) : safePrize(L.qi);
  if (L.style === 'solo') {
    G.scores[pid] = prize;
    L.results.push({ pid, prize, reached });
    const msg = { win: 'You climbed all 15 steps!', walk: 'You decided to stop.', wrong: 'Oh no, that was not the right answer.', time: 'Time is up!' }[kind];
    const last = L.runIdx >= L.pids.length - 1;
    const w = h('div', { class: 'intro result' }, avatar(pid, 'xxl'), h('h2', null, msg),
      h('div', { class: 'prize-big' }, ico('1FA99'), fmtPts(prize), h('small', null, ' points')),
      h('p', null, 'Steps answered correctly: ' + reached + ' of 15'),
      h('button', { class: 'btn primary big', onclick: () => { if (last) finishLadder(); else { L.runIdx++; beginRun(); } } },
        last ? 'See the podium' : 'Next: ' + pname(L.pids[L.runIdx + 1]) + ' →'));
    render(w, 'Golden Ladder');
    if (kind === 'win') { sfx('win'); confetti(200); } else if (kind === 'wrong' || kind === 'time') sfx('lose'); else sfx('ok');
  } else {
    L.teamPrize = prize; L.teamReached = reached; L.teamKind = kind;
    finishLadder();
  }
}
function finishLadder() {
  if (L.style === 'solo') {
    const order = L.pids.slice().sort((a, b) => G.scores[b] - G.scores[a] || (L.results.find(r => r.pid === b).reached - L.results.find(r => r.pid === a).reached));
    finishGame({ title: 'Golden Ladder results', order, scoreText: id => fmtPts(G.scores[id]) + ' pts', again: () => startLadder(L.cfg, L.pids) });
  } else {
    const order = L.pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    const kind = L.teamKind;
    const note = h('div', { class: 'team-prize' }, ico('1F3C6'), h('div', null, h('b', null, 'Team prize: ' + fmtPts(L.teamPrize) + ' points'),
      h('small', null, kind === 'win' ? 'The team climbed all 15 steps!' : 'Steps answered correctly: ' + L.teamReached + ' of 15')));
    finishGame({ title: kind === 'win' ? 'You did it!' : 'Golden Ladder results', subtitle: 'Points show how much each player contributed.', order, note,
      scoreText: id => fmtPts(G.scores[id]) + ' pts', again: () => startLadder(L.cfg, L.pids) });
  }
}

/* ============================================================
   Mode 2 — Memory (synonym, opposite and word+picture pairs)
   ============================================================ */
const IC_COUNT = {};
WORDS.forEach(x => { if (x.ic) IC_COUNT[x.ic] = (IC_COUNT[x.ic] || 0) + 1; });
/** words whose picture is unique, so a word+picture pair has one right answer */
const PIC_WORDS = WORDS.filter(x => x.ic && IC_COUNT[x.ic] === 1);

function setupMemory() {
  const lv = [{ v: 'easy', label: 'Easy' }, { v: 'medium', label: 'Medium' }, { v: 'hard', label: 'Hard' }, { v: 'mixed', label: 'Mixed' }];
  setupScreen({
    id: 'memory', name: 'Memory', ic: '1F9E0',
    desc: 'Turn over two cards. Find pairs of adjectives that go together. A pair lets you play again!',
    options: [
      { key: 'kind', label: 'Which pairs?', def: 'mixed', choices: [{ v: 'syn', label: 'Synonyms', desc: 'happy – glad' }, { v: 'opp', label: 'Opposites', desc: 'big – small' },
        { v: 'pic', label: 'Word + picture', desc: 'tall – 🦒' }, { v: 'mixed', label: 'Mixed' }] },
      { key: 'size', label: 'How many cards?', def: 16, choices: [{ v: 12, label: '12 cards' }, { v: 16, label: '16 cards' }, { v: 20, label: '20 cards' }] },
      { key: 'level', label: 'Level', def: 'medium', choices: lv }
    ],
    rules: ['Find a pair → +10 points and you go again. Every extra pair in a row gives +2 more.', 'Miss → the next player takes over.'],
    onStart: startMemory
  });
}
function buildPairs(kind, n, levels) {
  const pairs = [], usedWords = [];
  const clear = w => { const nr = near(w); return usedWords.every(x => x !== w && !nr.has(x)); };
  let guard = 0;
  while (pairs.length < n && guard++ < 800) {
    const k = kind === 'mixed' ? pick(['syn', 'opp', 'pic']) : kind;
    const pool = WORDS.filter(x => levels.includes(x.l) && clear(x.w));
    if (!pool.length) break;
    if (k === 'pic') {
      const a = pick(pool.filter(x => PIC_WORDS.includes(x)));
      if (!a) continue;
      pairs.push({ k, a, bText: null, bIc: a.ic }); usedWords.push(a.w);
    } else {
      const a = pick(pool.filter(x => (k === 'syn' ? SYN : OPP).get(x.w).size > 0));
      if (!a) continue;
      const bs = Array.from((k === 'syn' ? SYN : OPP).get(a.w)).map(byWord).filter(b => b.l <= Math.max.apply(null, levels) + 1 && clear(b.w));
      if (!bs.length) continue;
      const b = pick(bs);
      pairs.push({ k, a, b }); usedWords.push(a.w, b.w);
    }
  }
  return pairs;
}
function startMemory(cfg, pids) {
  newGame('memory', pids);
  const pairs = buildPairs(cfg.kind, cfg.size / 2, LEVEL_SETS[cfg.level]);
  if (pairs.length < 4) { toast('Not enough words for this setting', 'bad'); return setupMemory(); }
  const cards = [];
  pairs.forEach((p, i) => {
    cards.push({ pair: i, text: p.a.w, ic: null, word: p.a });
    cards.push(p.k === 'pic' ? { pair: i, text: null, ic: p.bIc, word: p.a } : { pair: i, text: p.b.w, ic: null, word: p.b });
  });
  const deck = shuffle(cards);
  const M = { turn: 0, up: [], busy: false, found: 0, mistakes: 0, combo: 0, pairs: pairs.length };
  G.cur = pids[0];
  const bar = scoreBar(pids, G.scores); G.bar = bar;
  const banner = h('div', { class: 'who-banner slim' });
  const paintTurn = () => {
    const pid = pids[M.turn % pids.length]; G.cur = pid; bar.update(G.scores, pid);
    banner.style.setProperty('--pc', PCOLORS[pid]);
    banner.replaceChildren(avatar(pid, 'md'), h('div', null, h('b', null, pname(pid) + '’s turn'), h('small', null, 'Pairs found: ' + M.found + ' of ' + M.pairs + (M.combo > 1 ? ' · combo x' + M.combo : ''))));
  };
  const cols = cfg.size === 20 ? 5 : 4;
  const grid = h('div', { class: 'mgrid', style: '--cols:' + cols + ';--rows:' + Math.ceil(cfg.size / cols) });
  deck.forEach((c, idx) => {
    const front = c.ic ? h('span', { class: 'face front pic' }, ico(c.ic)) : h('span', { class: 'face front word' }, h('span', null, c.text));
    c.el = h('button', { class: 'mcard', 'aria-label': 'Card ' + (idx + 1), onclick: () => flip(c) },
      h('span', { class: 'face back' }, ico('2753')), front);
    grid.append(c.el);
  });
  render(h('div', { class: 'memory' }, bar, banner, grid), 'Memory');
  paintTurn();

  function flip(c) {
    if (M.busy || c.up || c.done) return;
    c.up = true; c.el.classList.add('up'); sfx('flip');
    if (c.text && !c.ic) speak(c.text);
    M.up.push(c);
    if (M.up.length < 2) return;
    M.busy = true;
    const [a, b] = M.up, pid = pids[M.turn % pids.length];
    if (a.pair === b.pair) {
      Timers.set(() => {
        a.done = b.done = true; a.el.classList.add('done'); b.el.classList.add('done');
        a.el.style.setProperty('--pc', PCOLORS[pid]); b.el.style.setProperty('--pc', PCOLORS[pid]);
        M.found++; M.combo++; M.up = [];
        sfx('match'); confettiFrom(a.el, 18);
        addScore(pid, 10 + 2 * (M.combo - 1));
        recordAnswer(pid, a.word.w, true, false);
        if (M.found === M.pairs) return Timers.set(endMemory, 900);
        M.busy = false; paintTurn();
      }, 500);
    } else {
      Timers.set(() => {
        a.up = b.up = false; a.el.classList.remove('up'); b.el.classList.remove('up'); M.up = [];
        M.mistakes++; M.combo = 0; recordAnswer(pid, null, false, false);
        M.turn++; M.busy = false; sfx('ko'); paintTurn();
      }, 1200);
    }
  }
  function endMemory() {
    if (M.mistakes === 0 && M.pairs >= 8) pids.forEach(id => award(id, 'memory'));
    const order = pids.slice().sort((x, y) => G.scores[y] - G.scores[x]);
    finishGame({ title: 'Memory finished!', subtitle: 'Mistakes in total: ' + M.mistakes, order, scoreText: id => G.scores[id] + ' pts', again: () => startMemory(cfg, pids) });
  }
}

/* ============================================================
   Mode 3 — Match-Up (connect synonyms or opposites)
   ============================================================ */
function setupMatch() {
  const lv = [{ v: 'easy', label: 'Easy' }, { v: 'medium', label: 'Medium' }, { v: 'hard', label: 'Hard' }, { v: 'mixed', label: 'Mixed' }];
  setupScreen({
    id: 'match', name: 'Match-Up', ic: '1F517',
    desc: 'Connect each word on the left with its partner on the right: words with the same meaning, or opposites.',
    options: [
      { key: 'kind', label: 'What do we match?', def: 'mixed', choices: [{ v: 'syn', label: 'Same meaning' }, { v: 'opp', label: 'Opposites' }, { v: 'mixed', label: 'Both (one each round)' }] },
      { key: 'rounds', label: 'Rounds per player', def: 1, choices: [{ v: 1, label: '1' }, { v: 2, label: '2' }, { v: 3, label: '3' }] },
      { key: 'level', label: 'Level', def: 'medium', choices: lv }
    ],
    rules: ['Tap a word on the left, then its partner on the right.', 'Right at the first try = 10 points; after a mistake = 4 points.'],
    onStart: startMatch
  });
}
function buildMatchPairs(kind, n, levels) {
  const map = kind === 'syn' ? SYN : OPP;
  for (const strict of [true, false]) {
    const pairs = [], used = [];
    const clear = w => { if (used.includes(w)) return false; if (!strict) return used.every(x => !related(w, x)); const nr = near(w); return used.every(x => !nr.has(x)); };
    let guard = 0;
    while (pairs.length < n && guard++ < 600) {
      const cands = WORDS.filter(x => levels.includes(x.l) && map.get(x.w).size > 0 && clear(x.w));
      if (!cands.length) break;
      const a = pick(cands);
      const bs = Array.from(map.get(a.w)).map(byWord).filter(b => b.l <= Math.max.apply(null, levels) + 1 && clear(b.w));
      if (!bs.length) continue;
      const b = pick(bs);
      pairs.push({ a, b }); used.push(a.w, b.w);
    }
    if (pairs.length === n) return pairs;
  }
  return null;
}
function startMatch(cfg, pids) {
  newGame('match', pids);
  const totalRounds = cfg.rounds * pids.length;
  let round = 0;
  const levels = LEVEL_SETS[cfg.level];
  const perfect = new Set();
  const bar = scoreBar(pids, G.scores); G.bar = bar;

  function playRound() {
    const pid = pids[round % pids.length]; G.cur = pid; bar.update(G.scores, pid);
    const kind = cfg.kind === 'mixed' ? (round % 2 === 0 ? 'syn' : 'opp') : cfg.kind;
    const pairs = buildMatchPairs(kind, 5, levels);
    if (!pairs) { toast('Not enough words for this setting', 'bad'); return setupMatch(); }
    let mistakes = 0, found = 0, selected = null;
    const tries = new Map();
    const left = shuffle(pairs.map((p, i) => ({ text: p.a.w, i }))), right = shuffle(pairs.map((p, i) => ({ text: p.b.w, i })));
    const mk = (item, side) => {
      const b = h('button', { class: 'mw ' + side, onclick: () => click(item, side, b) }, h('span', { class: 'mw-n' }), h('span', null, item.text));
      item.el = b; return b;
    };
    const lcol = h('div', { class: 'mcol' }, left.map(it => mk(it, 'l'))), rcol = h('div', { class: 'mcol' }, right.map(it => mk(it, 'r')));
    const title = kind === 'syn' ? 'Same meaning' : 'Opposites';
    const banner = h('div', { class: 'who-banner slim', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'md'),
      h('div', null, h('b', null, pname(pid) + ' – ' + title), h('small', null, 'Round ' + (round + 1) + ' of ' + totalRounds + ' · tap a word on the left, then its partner')));
    const mid = h('div', { class: 'mmid' }, kind === 'syn' ? '=' : '↔');
    render(h('div', { class: 'matchup' }, bar, banner, h('div', { class: 'mboard ' + kind }, lcol, mid, rcol)), 'Match-Up');
    bar.update(G.scores, pid);

    function click(item, side, el) {
      if (item.done) return;
      sfx('click');
      speak(item.text);
      if (side === 'l') {
        if (selected) selected.el.classList.remove('sel');
        selected = item; el.classList.add('sel'); return;
      }
      if (!selected) { toast('Pick a word on the left first', ''); return; }
      const l = selected;
      tries.set(l.i, (tries.get(l.i) || 0));
      if (l.i === item.i) {
        const first = tries.get(l.i) === 0;
        l.done = item.done = true; found++;
        [l.el, item.el].forEach(e => { e.classList.remove('sel'); e.classList.add('done'); e.style.setProperty('--pc', PCOLORS[pid]); e.firstChild.textContent = String(found); });
        sfx('match'); confettiFrom(el, 16);
        addScore(pid, first ? 10 : 4);
        recordAnswer(pid, pairs[l.i].a.w, true, false);
        selected = null;
        if (found === 5) Timers.set(roundDone, 900);
      } else {
        tries.set(l.i, tries.get(l.i) + 1); mistakes++;
        sfx('ko'); [l.el, el].forEach(e => { e.classList.add('bad'); Timers.set(() => e.classList.remove('bad'), 500); });
        l.el.classList.remove('sel'); selected = null;
        recordAnswer(pid, pairs[l.i].a.w, false, false); noteResult(pairs[l.i].b.w, false);
      }
    }
    function roundDone() {
      if (mistakes === 0) { perfect.add(pid); award(pid, 'match'); }
      round++;
      sfx('levelup'); confetti(60);
      const last = round >= totalRounds;
      openModal(h('div', { class: 'center' }, h('h3', null, mistakes === 0 ? 'Perfect round!' : 'Round complete'),
        h('p', null, mistakes === 0 ? 'No mistakes at all.' : 'Mistakes: ' + mistakes),
        h('div', { class: 'actions' }, h('button', { class: 'btn primary big', onclick: () => { closeModal(); } }, last ? 'See the podium' : 'Next: ' + pname(pids[round % pids.length])))),
      () => { if (last) endMatch(); else playRound(); });
    }
  }
  function endMatch() {
    const order = pids.slice().sort((x, y) => G.scores[y] - G.scores[x]);
    finishGame({ title: 'Match-Up finished!', order, scoreText: id => G.scores[id] + ' pts', again: () => startMatch(cfg, pids) });
  }
  playRound();
}

/* ---------- flashcards ---------- */
function startFlash(deck0) {
  let deck = deck0.slice(), total = deck.length, known = 0, again = [];
  function next() {
    if (!deck.length) {
      if (again.length) {
        const w = h('div', { class: 'intro' }, h('h2', null, 'Round finished'), h('p', null, 'You marked ' + again.length + ' cards to practise again.'),
          h('div', { class: 'actions' }, h('button', { class: 'btn primary big', onclick: () => { deck = shuffle(again); again = []; next(); } }, 'Practise them'),
            h('button', { class: 'btn', onclick: showWordBank }, 'Word Bank')));
        render(w, 'Flashcards'); return;
      }
      sfx('win'); confetti(120);
      render(h('div', { class: 'intro' }, h('h2', null, ico('1F389'), ' All cards done!'), h('p', null, total + ' words reviewed.'),
        h('div', { class: 'actions' }, h('button', { class: 'btn primary big', onclick: showWordBank }, 'Back to the Word Bank'))), 'Flashcards');
      return;
    }
    const x = deck[0]; let flipped = false;
    noteViewed(x.w);
    const front = h('div', { class: 'fc-face front' }, ico(wordIcon(x), 'xxl'), h('div', { class: 'fc-word' }, x.w), h('small', null, 'Tap to see the meaning'));
    const back = h('div', { class: 'fc-face back' }, h('div', { class: 'fc-word sm' }, x.w), h('div', { class: 'wd-ca' }, x.ca),
      h('p', null, cap(x.def) + '.'), h('p', { class: 'wd-ex' }, x.ex));
    const card = h('div', { class: 'fcard', role: 'button', tabindex: 0, 'aria-label': 'Flip card', onclick: flip }, front, back);
    const prog = h('div', { class: 'fc-prog' }, h('i', { style: 'width:' + (100 * known / total) + '%' }));
    const btns = h('div', { class: 'actions fc-actions' },
      h('button', { class: 'btn danger', onclick: () => { again.push(deck.shift()); sfx('ko'); next(); } }, '✗ Again'),
      h('button', { class: 'btn', onclick: () => speak(x.w) }, ico('1F50A'), ' Listen'),
      h('button', { class: 'btn primary', onclick: () => { deck.shift(); known++; sfx('ok'); next(); } }, '✓ I know it'));
    function flip() { flipped = !flipped; card.classList.toggle('flipped', flipped); sfx('flip'); if (flipped) speak(x.ex); }
    render(h('div', { class: 'flash' }, h('div', { class: 'muted' }, 'Card ' + (known + again.length + 1) + ' of ' + total), prog, card, btns,
      h('div', { class: 'actions' }, h('button', { class: 'btn small', onclick: showWordBank }, '← Word Bank'))), 'Flashcards');
    Keys.on(e => { if (e.key === ' ' || e.key === 'Enter') { flip(); return true; } if (e.key === 'ArrowRight') { deck.shift(); known++; sfx('ok'); next(); return true; } if (e.key === 'ArrowLeft') { again.push(deck.shift()); next(); return true; } return false; });
    Timers.set(() => speak(x.w), 300);
  }
  next();
}

const LEVEL_CHOICES = [{ v: 'easy', label: 'Easy' }, { v: 'medium', label: 'Medium' }, { v: 'hard', label: 'Hard' }, { v: 'mixed', label: 'Mixed' }];

function startFaces(cfg, pids) {

}
function setupGap() {

    ],

    onStart: startGap
  });
}
function startGap(cfg, pids) { startRounds({ mode: 'gap', title: 'Sentence Gap', cfg, pids, types: ['gap'], restart: startGap }); }

function startRounds(spec) {
  const { cfg, pids } = spec;
  newGame(spec.mode, pids);
  const total = cfg.per * pids.length;
  const ctx = { levels: LEVEL_SETS[cfg.level], types: spec.types, used: new Set(), close: cfg.level === 'hard' };
  const bar = scoreBar(pids, G.scores); G.bar = bar;
  let i = 0;
  const perfect = Object.fromEntries(pids.map(id => [id, true]));

  function ask() {
    if (i >= total) return end();
    const q = nextQuestion(ctx);
    if (!q) { toast('Not enough words for this setting', 'bad'); return end(); }
    const pid = pids[i % pids.length]; G.cur = pid;
    let done = false, moved = false, hint = false, timer = null, qv = null;
    const nextBtn = h('button', { class: 'btn primary', hidden: true, onclick: go }, 'Next →');
    const hintBtn = hintButton(() => { hint = true; qv.showHint(); });
    render(() => {
      const banner = h('div', { class: 'who-banner slim', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'md'),
        h('div', null, h('b', null, pname(pid)), h('small', null, 'Question ' + (i + 1) + ' of ' + total)));
      qv = qView(q, pick1);
      const parts = [bar, banner];
      if (cfg.timer) { timer = countdown(cfg.timer, () => pick1(-1), { tick: true }); parts.push(timer.el); }
      parts.push(qv.el, h('div', { class: 'under-q' }, hintBtn, nextBtn));
      Keys.on(e => { if (done && (e.key === 'Enter' || e.key === ' ')) { go(); return true; } return false; });
      return h('div', { class: 'rounds' }, parts);
    }, spec.title);
    bar.update(G.scores, pid);
    if (q.speakText && q.type !== 'listen') Timers.set(() => speak(q.speakText), 350);

    function pick1(idx) {
      if (done) return;
      done = true; sfx('click');
      const frac = timer ? Math.max(0, timer.left() / cfg.timer) : null;
      if (timer) timer.stop();
      qv.reveal(idx);
      const ok = idx === q.answer;
      recordAnswer(pid, q.word, ok, hint);
      if (ok) {
        let pts = 10 + Math.min(G.streak[pid] - 1, 5) * 2;
        if (frac != null) pts += Math.round(5 * frac);
        if (hint) pts = Math.round(pts / 2);
        addScore(pid, pts); sfx('ok'); confettiFrom(qv.btns[q.answer], 24);
        toast('+' + pts + ' points', 'good');
      } else { perfect[pid] = false; sfx('ko'); }
      qv.showExplain(ok); afterAnswerSpeak(q);
      nextBtn.hidden = false; hintBtn.disabled = true;
      Timers.set(go, ok ? 2600 : 3800);
    }
    function go() { if (!done || moved) return; moved = true; i++; ask(); }
  }
  function end() {
    if (spec.mode === 'faces' && cfg.per >= 5) pids.forEach(id => { if (perfect[id]) award(id, 'faces'); });
    const order = pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    finishGame({ title: spec.title + ' finished!', order, scoreText: id => G.scores[id] + ' pts (' + G.correct[id] + ' ✓)', again: () => spec.restart(cfg, pids) });
  }
  ask();
}

function startSpeed(cfg, pids) {
  newGame('speed', pids);

  const bar = scoreBar(pids, G.scores); G.bar = bar;

  function intro() {
    const pid = pids[turn]; G.cur = pid;
    render(h('div', { class: 'intro' }, bar, avatar(pid, 'xxl'), h('h2', null, pname(pid) + ', get ready!'),
      h('p', null, cfg.secs + ' seconds. Go as fast as you can!'),

    bar.update(G.scores, pid);
  }
  function countIn(pid) {
    let n = 3;
    const big = h('div', { class: 'count-in' }, String(n));
    render(h('div', { class: 'intro' }, big), 'Speed Round');
    sfx('tick');
    Timers.every(() => { n--; if (n <= 0) { run(pid); return; } big.textContent = String(n); sfx('tick'); }, 800);
  }
  function run(pid) {
    let over = false, power = true, answered = 0, wrongs = 0, locked = false, cd = null, stat = null, area = null, current = null;
    const startCorrect = G.correct[pid];
    const paintStat = () => { stat.replaceChildren(h('span', null, ico('2705', 'tiny'), ' ' + (G.correct[pid] - startCorrect) + ' correct'), h('span', null, ico('1F525', 'tiny'), ' combo x' + G.streak[pid])); };
    render(() => {
      stat = h('div', { class: 'speed-stat' });
      area = h('div', { class: 'speed-area' });
      cd = countdown(cfg.secs, () => { over = true; locked = true; if (current) current.disable(true); sfx('lose'); toast('Time is up!', 'gold'); Timers.set(finishTurn, 1400); }, { big: true, tick: true });
      const pwr = h('button', { class: 'btn small', onclick: () => { if (!power || over) return; power = false; pwr.disabled = true; cd.add(10); sfx('lifeline'); toast('+10 seconds!', 'gold'); } }, ico('23F3'), ' +10 s');
      return h('div', { class: 'rounds speed' }, bar, h('div', { class: 'who-banner slim', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'md'), h('div', null, h('b', null, pname(pid)), h('small', null, 'Speed Round'))),
        cd.el, stat, area, h('div', { class: 'under-q' }, pwr));
    }, 'Speed Round');
    bar.update(G.scores, pid);
    function nextQ() {
      if (over) return;
      const q = nextQuestion(ctx); if (!q) { over = true; return finishTurn(); }
      locked = false;
      const qv = qView(q, idx => {
        if (locked || over) return;
        locked = true; answered++;
        qv.reveal(idx);
        const ok = idx === q.answer;
        recordAnswer(pid, q.word, ok, false);
        if (ok) { addScore(pid, 10 + Math.min(G.streak[pid] - 1, 5) * 2); sfx('ok'); }
        else { wrongs++; cd.add(-3); sfx('ko'); }
        paintStat();
        Timers.set(() => { qv.destroy(); nextQ(); }, ok ? 450 : 900);
      });
      current = qv;
      area.replaceChildren(qv.el);
      if (q.speakText && q.type !== 'listen') speak(q.speakText);
    }
    function finishTurn() {
      const got = G.correct[pid] - startCorrect;
      G.extra[pid] = Math.max(G.extra[pid] || 0, got);
      if (got >= 15) award(pid, 'speed15');
      const last = turn >= pids.length - 1;
      render(h('div', { class: 'intro result' }, bar, avatar(pid, 'xxl'), h('h2', null, pname(pid) + ': ' + got + ' correct!'),
        h('p', null, answered + ' answered · ' + wrongs + ' wrong'),
        h('button', { class: 'btn primary big', onclick: () => { if (last) endSpeed(); else { turn++; intro(); } } }, last ? 'See the podium' : 'Next: ' + pname(pids[turn + 1]) + ' →')), 'Speed Round');
      bar.update(G.scores, pid);
      sfx(got >= 8 ? 'win' : 'ok'); if (got >= 8) confetti(100);
    }
    paintStat(); nextQ();
  }
  function endSpeed() {
    const order = pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    finishGame({ title: 'Speed Round finished!', order, scoreText: id => G.scores[id] + ' pts (' + (G.extra[id] || 0) + ' ✓)', again: () => startSpeed(cfg, pids) });
  }
  intro();
}

/* ============================================================

const BALLOON_COLORS = ['#ff6b6b', '#ffd23f', '#4cc9f0', '#3ddc97', '#a78bfa', '#fb923c', '#f472b6'];
function balloonsSVG(lives) {
  let s = '<svg viewBox="0 0 320 230" role="img" aria-label="' + lives + ' balloons left">';
  for (let i = 0; i < 7; i++) {
    const x = 36 + i * 41, y = 62 + (i % 2 ? 22 : 0) + Math.abs(3 - i) * 5;
    const pop = i >= lives;
    s += '<g class="bl' + (pop ? ' popped' : '') + '">' +
      '<path d="M' + x + ' ' + (y + 40) + ' Q' + (x + (160 - x) * .4) + ' ' + 150 + ' 160 196" stroke="#cfd8ff" stroke-width="1.6" fill="none"/>' +
      '<ellipse cx="' + x + '" cy="' + y + '" rx="25" ry="31" fill="' + BALLOON_COLORS[i] + '" stroke="rgba(0,0,0,.25)" stroke-width="2"/>' +
      '<path d="M' + (x - 14) + ' ' + (y - 14) + ' Q' + (x - 10) + ' ' + (y - 24) + ' ' + (x) + ' ' + (y - 26) + '" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round" fill="none"/>' +
      '<path d="M' + (x - 4) + ' ' + (y + 31) + ' L' + x + ' ' + (y + 38) + ' L' + (x + 4) + ' ' + (y + 31) + 'Z" fill="' + BALLOON_COLORS[i] + '"/></g>';
  }
  s += '<g><rect x="132" y="192" width="56" height="30" rx="7" fill="#c98b4a" stroke="#7a4b1d" stroke-width="3"/>' +
    '<path d="M132 203 H188 M132 212 H188" stroke="#7a4b1d" stroke-width="2"/>' +
    '<circle cx="160" cy="190" r="9" fill="#ffe0b3" stroke="#7a4b1d" stroke-width="2"/></g></svg>';
  return s;
}
function setupHangman() {
  setupScreen({
    id: 'hangman', name: 'Balloon Pop', ic: '1F388',
    desc: 'Guess the hidden adjective letter by letter. Every wrong letter pops a balloon – keep the basket in the air!',
    options: [
      { key: 'per', label: 'Words per player', def: 1, choices: [{ v: 1, label: '1' }, { v: 2, label: '2' }, { v: 3, label: '3' }] },
      { key: 'level', label: 'Level', def: 'medium', choices: LEVEL_CHOICES }
    ],
    rules: ['Right letter: 10 points for each time it appears, and you play again.', 'Wrong letter: a balloon pops and the next player goes.',
      'Complete the word: +30 bonus. The ? button gives the Catalan translation (bonus halved).'],
    onStart: startHangman
  });
}
function startHangman(cfg, pids) {
  newGame('hangman', pids);
  const levels = LEVEL_SETS[cfg.level];
  const total = cfg.per * pids.length;
  const words = sample(WORDS.filter(x => levels.includes(x.l) && /^[a-z -]+$/.test(x.w) && x.w.length >= 3 && x.w.length <= 12), total);
  const bar = scoreBar(pids, G.scores); G.bar = bar;
  let k = 0;

  function playWord() {
    if (k >= total) return end();
    const t = words[k], letters = new Set(t.w.replace(/[^a-z]/g, '').split(''));
    let lives = 7, turn = k % pids.length, hint = false, finished = false, wrongCount = 0;
    const guessed = new Set();
    const balloons = h('div', { class: 'balloons' });
    const wordEl = h('div', { class: 'hm-word' });
    const hintEl = h('div', { class: 'q-hint' });
    const banner = h('div', { class: 'who-banner slim' });
    const kb = h('div', { class: 'kb' });
    const keyBtns = {};
    'qwertyuiopasdfghjklzxcvbnm'.split('').forEach(c => {
      const b = h('button', { class: 'key', onclick: () => guess(c) }, c.toUpperCase());
      keyBtns[c] = b;
    });
    ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'].forEach(row => kb.append(h('div', { class: 'kb-row' }, row.split('').map(c => keyBtns[c]))));
    const paint = () => {
      balloons.innerHTML = balloonsSVG(lives);
      wordEl.replaceChildren(...t.w.split('').map(c => /[a-z]/.test(c) ? h('span', { class: 'hl' + (guessed.has(c) || finished ? ' on' : '') }, guessed.has(c) || finished ? c.toUpperCase() : ' ') : h('span', { class: 'hl sep' }, c === ' ' ? ' ' : c)));
      const pid = pids[turn % pids.length]; G.cur = pid; bar.update(G.scores, pid);
      banner.style.setProperty('--pc', PCOLORS[pid]);
      banner.replaceChildren(avatar(pid, 'md'), h('div', null, h('b', null, pname(pid) + (finished ? '' : '’s letter')), h('small', null, 'Word ' + (k + 1) + ' of ' + total + ' · ' + lives + ' balloons left')));
    };
    function guess(c) {
      if (finished || guessed.has(c)) return;
      guessed.add(c);
      const pid = pids[turn % pids.length], b = keyBtns[c];
      b.disabled = true;
      if (letters.has(c)) {
        b.classList.add('ok'); sfx('match');
        const n = t.w.split('').filter(x => x === c).length;
        addScore(pid, 10 * n);
        if ([...letters].every(l => guessed.has(l))) return solved(pid);
      } else {
        b.classList.add('bad'); lives--; wrongCount++; sfx('pop'); turn++;
        if (lives <= 0) return failed(pid);
      }
      paint();
    }
    function solved(pid) {
      finished = true; paint();
      addScore(pid, hint ? 15 : 30);
      recordAnswer(pid, t.w, true, hint);
      if (wrongCount === 0) award(pid, 'hangman');
      sfx('ok'); confetti(90);
      after('Well done, ' + pname(pid) + '!', true);
    }
    function failed(pid) {
      finished = true; paint();
      noteResult(t.w, false); G.missed.add(t.w);
      recordAnswer(pid, null, false, false);
      sfx('lose');
      after('All the balloons popped!', false);
    }
    function after(msg, ok) {
      $$('.key', kb).forEach(b => { b.disabled = true; });
      const last = k >= total - 1;
      hintEl.classList.add('on', ok ? 'okx' : 'kox');
      hintEl.replaceChildren(h('b', null, msg + ' '), h('span', null, t.w + ' = ' + t.ca + '. ' + t.ex));
      speak(t.w);
      nextWrap.replaceChildren(h('button', { class: 'btn primary big', onclick: () => { k++; playWord(); } }, last ? 'See the podium' : 'Next word →'));
    }
    const nextWrap = h('div', { class: 'actions' });
    const catChip = h('span', { class: 'chip big' }, ico(CATS[t.cat].ic, 'tiny'), ' ' + CATS[t.cat].label);
    const hintBtn = hintButton(() => { hint = true; hintEl.classList.add('on'); hintEl.replaceChildren(h('b', null, 'En català: '), h('span', { class: 'chip' }, t.ca)); });
    render(() => {
      Keys.on(e => { const c = e.key.toLowerCase(); if (c.length === 1 && c >= 'a' && c <= 'z') { guess(c); return true; } return false; });
      return h('div', { class: 'hangman' }, bar, banner, h('div', { class: 'hm-main' }, balloons, h('div', { class: 'hm-side' }, h('div', { class: 'hm-cat' }, catChip, h('small', null, t.w.replace(/[^a-z]/g, '').length + ' letters')), wordEl, hintEl, h('div', { class: 'under-q' }, hintBtn))), kb, nextWrap);
    }, 'Balloon Pop');
    paint();
  }
  function end() {
    const order = pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    finishGame({ title: 'Balloon Pop finished!', order, scoreText: id => G.scores[id] + ' pts', again: () => startHangman(cfg, pids) });
  }
  playWord();
}

    } else showHub();
